<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar & Pie Chart Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .chart-container {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h2>Followers Gained (Monthly)</h2>
  <div class="chart-container">
    <canvas id="barChart"></canvas>
  </div>

  <h2>Conversion Source Breakdown</h2>
  <div class="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <script src="x.js"></script>

</body>
</html>
